; OPcache — produzione.
;
; La differenza tra un'applicazione Laravel con e senza OPcache configurato e'
; nell'ordine del triplo sui tempi di risposta. Non e' un'ottimizzazione
; avanzata: e' configurazione di base che spesso resta ai valori predefiniti.

opcache.enable = 1
opcache.enable_cli = 0

; Dimensionato su un'applicazione Laravel con Filament: sotto i 128M la cache
; si riempie e ricomincia da capo, il che e' peggio di non averla.
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000

; In produzione i file non cambiano mai senza un nuovo container: controllare le
; date di modifica a ogni richiesta e' lavoro sprecato.
;
; Conseguenza: dopo un deploy i worker vanno riavviati (queue:restart), perche'
; mantengono in memoria il codice caricato all'avvio.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

opcache.save_comments = 1
opcache.fast_shutdown = 1

; La cache dei file su disco sopravvive al riavvio del container: il primo
; utente dopo un riavvio non paga la ricompilazione.
opcache.file_cache = /tmp/opcache
opcache.file_cache_only = 0

; JIT: su un'applicazione web il guadagno e' marginale, perche' il tempo se ne
; va in I/O e non in calcolo. Resta disattivato finche' una misura non dimostra
; il contrario.
opcache.jit = disable
