; Configurazione PHP per l'immagine dell'applicazione.
;
; Le voci qui sotto sono quelle che cambiano il comportamento in produzione. Il
; resto resta ai valori predefiniti: una configurazione lunga e' una
; configurazione che nessuno rilegge.

; Un caricamento che supera questi limiti viene rifiutato dal server web prima
; di raggiungere l'applicazione. Il limite applicativo (config/documents.php)
; deve restare INFERIORE a questo, altrimenti l'utente riceve un errore del
; server invece di un messaggio comprensibile.
upload_max_filesize = 20M
post_max_size = 24M
max_file_uploads = 20

; Un limite di memoria alto non risolve i problemi di memoria: li nasconde
; finche' il cliente non diventa grande. Le elaborazioni massive vanno a
; blocchi.
memory_limit = 256M

; Le richieste web non devono durare piu' di questo. Cio' che dura di piu' va
; in coda: e' il criterio, non un ripiego.
max_execution_time = 30
max_input_time = 30

; Il fuso e' UTC ovunque: la conversione al fuso dell'utente appartiene alla
; presentazione, non ai dati.
date.timezone = UTC

; In produzione gli errori si registrano, non si mostrano: una pagina d'errore
; con la traccia espone percorsi, configurazione e talvolta credenziali.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; La versione di PHP negli header e' un'informazione che non serve a nessuno
; tranne a chi cerca installazioni non aggiornate.
expose_php = Off

; La sessione vive in Redis; queste restano come rete di sicurezza.
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; Impedisce a PHP di indovinare un file quando il percorso richiesto non esiste:
; e' il comportamento che permette a /immagine.jpg/x.php di essere eseguito.
cgi.fix_pathinfo = 0

realpath_cache_size = 4096k
realpath_cache_ttl = 600
