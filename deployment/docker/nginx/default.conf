# Nginx — configurazione dell'applicazione.
#
# Ogni direttiva qui sotto ha una conseguenza dichiarata. Le configurazioni
# copiate da esempi generici funzionano, e portano con se' impostazioni che
# nessuno ha scelto.

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # La versione di nginx negli header serve solo a chi cerca installazioni
    # non aggiornate.
    server_tokens off;

    # Il limite deve essere COERENTE con post_max_size di PHP. Se qui e' piu'
    # basso, l'utente riceve un errore del server invece del messaggio
    # dell'applicazione; se e' piu' alto, il file viene trasferito per intero
    # prima di essere rifiutato.
    client_max_body_size 24M;

    # --- Intestazioni di sicurezza -----------------------------------------
    #
    # La CSP e' restrittiva e senza unsafe-inline sugli script. Livewire e
    # Alpine richiedono attenzione: gli script inline vanno serviti con un
    # nonce, non aprendo la direttiva.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Gli asset compilati hanno un hash nel nome: possono essere messi in cache
    # per un anno senza rischiare che un utente resti su una versione vecchia.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Deve essere maggiore di max_execution_time di PHP, altrimenti nginx
        # chiude la connessione mentre PHP sta ancora lavorando e nei log
        # compare un 502 senza causa apparente.
        fastcgi_read_timeout 60s;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # I file nascosti non si servono. .env, .git e simili non devono essere in
    # public/, ma se ci finiscono per errore questa riga evita che il difetto
    # diventi un incidente.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # I file dei clienti NON si servono da qui: vivono su un disco privato e
    # passano da un controller che autorizza, oppure da un URL firmato.
    location /storage/ {
        deny all;
    }

    error_page 404 /index.php;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
